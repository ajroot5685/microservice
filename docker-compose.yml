  # 8. CQRS Read DB - MongoDB (주문 조회 전용 Read Model)
  mongo-db:
    image: mongo:7.0
    container_name: mongo_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 1234
      TZ: Asia/Seoul
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M