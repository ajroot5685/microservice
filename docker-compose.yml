## 분산 추적 및 모니터링 애플리케이션은 버전 및 리소스 문제로 스킵
  # 8. Prometheus (메트릭 수집 저장소)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    environment:
      TZ: Asia/Seoul
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  # 9. Loki (로그 수집 저장소)
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    environment:
      TZ: Asia/Seoul
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  # 10. Grafana (통합 대시보드 UI)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"   # Grafana 대시보드 UI 포트
    environment:
      TZ: Asia/Seoul
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 512M

  # 11. OpenTelemetry Collector (추적 및 텔레메트리 중계자)
  otel:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: otel
    restart: unless-stopped
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    ports:
      - "4317:4317"   # OTLP gRPC 포트
      - "4318:4318"   # OTLP HTTP 포트
      - "8899:8888"   # Collector 자체 Prometheus 메트릭 포트
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  # 12. Tempo (분산 추적 저장소)
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "3200:3200"   # Tempo API 포트
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - ./tempo_data:/tmp/tempo
    environment:
      TZ: Asia/Seoul
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M