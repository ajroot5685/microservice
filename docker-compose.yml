services:
  # 1. User 도메인 DB
  user-db:
    image: mysql:8.0
    container_name: user_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: user12
      MYSQL_DATABASE: user_db
      TZ: Asia/Seoul
    ports:
      - "3310:3306"
    volumes:
      - ./user_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=64M
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # 2. Order 도메인 DB
  order-db:
    image: mysql:8.0
    container_name: order_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: order12
      MYSQL_DATABASE: order_db
      TZ: Asia/Seoul
    ports:
      - "3311:3306"
    volumes:
      - ./order_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=64M
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # 3. Catalog 도메인 DB
  catalog-db:
    image: mysql:8.0
    container_name: catalog_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: catalog12
      MYSQL_DATABASE: catalog_db
      TZ: Asia/Seoul
    ports:
      - "3312:3306"
    volumes:
      - ./catalog_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=64M
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # 4. Spring Cloud Bus 전용 RabbitMQ
  rabbitmq:
    image: rabbitmq:4-management
    container_name: config_bus
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      TZ: Asia/Seoul
    ports:
      - "5672:5672"   # Spring Boot 애플리케이션(AMQP) 통신용 포트
      - "15672:15672" # RabbitMQ 웹 관리 대시보드(UI) 포트
    volumes:
      - ./rabbitmq_data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  # 5. Apache Kafka (KRaft 모드 - 주키퍼 미사용)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: msa_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # KRaft 모드 활성화를 위한 설정들
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFICIAL_NAME: 'msa-kafka'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # 제어부(Controller) 관련 설정
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      # 고유 클러스터 ID (KRaft 구동 필수)
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      # 컨테이너 메모리 제한에 맞게 JVM 힙 크기 조절
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
      TZ: Asia/Seoul
    volumes:
      - ./kafka_data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # 6. Kafka 웹 모니터링 UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local-msa-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: "debezium-mysql-connect"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: "http://kafka-connect:8083"
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

